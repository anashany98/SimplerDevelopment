# TEMPORARY DEBUG compose — db + app ONLY.
# Why: the Coolify application-logs API serves the newest-created container of
# the stack; with only db+app present it surfaces the APP container's boot log
# (where the deploy failure lives). The app healthcheck is intentionally absent
# so `compose up` succeeds and the crash-looping app stays inspectable via the
# logs endpoint. Restore docker-compose.coolify.yml in Coolify after the
# diagnosis. Delete this file once done.
services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: simplerdev
    volumes:
      - simplerdev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simplerdev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: source
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -lc "echo '[boot] 1/6 bun install' &&
      bun install --frozen-lockfile --linker=hoisted &&
      echo '[boot] 2/6 verify db target' &&
      bun scripts/verify-db-target.ts &&
      echo '[boot] 3/6 drizzle migrate' &&
      bunx drizzle-kit migrate &&
      echo '[boot] 4/6 manual migrations' &&
      bun scripts/apply-local-manual-migrations.ts &&
      { [ -f .next/BUILD_ID ] && [ \"$(find . -name node_modules -prune -o -name .next -prune -o -name next-env.d.ts -prune -o -type f -exec sha256sum {} + | sort | sha256sum | cut -d' ' -f1)\" = \"$(cat .next/.src-hash 2>/dev/null)\" ] && [ \"$(env | grep -E '^(NEXT_PUBLIC_|AUTH_GOOGLE_|GOOGLE_CLIENT_)' | sort)\" = \"$(cat .next/.env-stamp 2>/dev/null)\" ] && echo 'reusing existing .next build' || { echo '[boot] 5/6 building Next (first boot, source or public env changed)'; find . -name node_modules -prune -o -name .next -prune -o -name next-env.d.ts -prune -o -type f -exec sha256sum {} + | sort | sha256sum | cut -d' ' -f1 > /tmp/.src-hash-before; find .next -mindepth 1 -delete 2>/dev/null || true; node node_modules/next/dist/bin/next build && cp /tmp/.src-hash-before .next/.src-hash && env | grep -E '^(NEXT_PUBLIC_|AUTH_GOOGLE_|GOOGLE_CLIENT_)' | sort > .next/.env-stamp; }; } &&
      echo '[boot] 6/6 starting next server' &&
      node node_modules/next/dist/bin/next start"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_BUILD_CPUS: ${NEXT_BUILD_CPUS:-2}
      NEXT_LOW_MEMORY_BUILD: ${NEXT_LOW_MEMORY_BUILD:-1}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/simplerdev
      DRIZZLE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/simplerdev
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-ws://localhost:3030}
      REALTIME_INTERNAL_URL: http://realtime:3030
      REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:-sd-local-dev-realtime-jwt-secret}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-sd-local-dev-realtime-internal-secret}
      AUTH_TRUST_HOST: "true"
      PORT: "3000"
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      WORKSPACE_TENANT_SECRETS_KEY: ${WORKSPACE_TENANT_SECRETS_KEY:-}
      PORTAL_KMS_KEY: ${PORTAL_KMS_KEY:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      CHAT_TOKEN_SECRET: ${CHAT_TOKEN_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-mailpit}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - simplerdev-app-node-modules:/workspace/node_modules
      - simplerdev-app-next:/workspace/.next
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  simplerdev-pgdata:
  simplerdev-app-node-modules:
  simplerdev-app-next:
