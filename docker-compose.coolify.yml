# ─────────────────────────────────────────────────────────────────────────────
# Coolify — PRODUCTION stack.
# Coolify: Base Directory=/, Docker Compose Location=/docker-compose.coolify.yml.
# Deploy from the Git repository. Source is baked into the image at build time;
# do NOT add a source bind mount over /workspace (it would hide that code).
# Keep docker-compose.yml for local bind-mounted development.
# ─────────────────────────────────────────────────────────────────────────────
# Changes vs the previous rev of this file:
# - serves a PRODUCTION build (built once, cached on a volume, served under
#   Node — see the app command), not `bun dev` (the dev server OOMs on shared
#   hosts — git history fa508d1).
# - public URLs are env-overridable so the host middleware accepts your deploy
#   domain (git history 68087ea). Set NEXTAUTH_URL / NEXT_PUBLIC_APP_URL /
#   NEXT_PUBLIC_SITE_URL in Coolify.
# - `minio` is gone (image is pull-restricted on Docker Hub and killed `up` —
#   git history e23f317). Media uploads need real S3 vars (forwarded below).
# - no `litellm` / host-local LM Studio (doesn't exist on a server). AI features
#   use real ANTHROPIC_API_KEY / OPENAI_API_KEY.
# - `container_name` removed so Coolify can run this next to other stacks.
# - only the app publishes a host port (${APP_PORT:-3000}); the database and
#   mailpit stay on the internal network only.
# - per-service memory limits + single-worker low-memory build flags keep the
#   whole stack inside a small VPS.
# - the Next build and `next start` run under the NODE runtime shipped in the
#   image: Next 16.3 production builds are fragile under the Bun runtime (the
#   CJS-wrapper crash was observed on Bun 1.3.11; see oven-sh/bun#25650/#25609
#   and the note in docker/Dockerfile.coolify). Bun remains the package manager
#   and runs the cron/realtime services. The boot command also fails loudly
#   when the build fails (the previous rev could mask a failed build and
#   `next start` on a missing build).
#
# Required Coolify environment variables (UI -> Environment Variables):
#   POSTGRES_PASSWORD             DB password. The 'postgres' default is
#                                 DEV-ONLY — set a strong one BEFORE the first
#                                 boot (the pgdata volume keeps it afterwards).
#   AUTH_SECRET                   openssl rand -base64 32
#   NEXTAUTH_URL                  https://your-domain
#   NEXT_PUBLIC_APP_URL           https://your-domain
#   NEXT_PUBLIC_SITE_URL          https://your-domain
#   WORKSPACE_TENANT_SECRETS_KEY  openssl rand -hex 32
#   PORTAL_KMS_KEY                openssl rand -base64 32
#   OAUTH_STATE_SECRET            openssl rand -hex 32
#   ENCRYPTION_KEY                openssl rand -hex 32   (64 hex chars)
#   CRON_SECRET                   openssl rand -hex 32   (cron refuses to boot without it)
#   REALTIME_JWT_SECRET           openssl rand -hex 32
#   REALTIME_INTERNAL_SECRET      openssl rand -hex 32
# Recommended: ANTHROPIC_API_KEY / OPENAI_API_KEY (AI features), RESEND_API_KEY
# + RESEND_FROM_EMAIL (real email — also set EMAIL_TRANSPORT=resend), S3_*
# (media uploads), AUTH_GOOGLE_ID/SECRET or GOOGLE_CLIENT_ID/SECRET (Google
# login — they are BUILD-TIME for the login button, see note in the app cmd).
#
# Testing this file locally? The `environment:` block WINS over `env_file:`
# (Docker semantics), so every `${VAR:-}` that is unset in the shell/.env
# arrives blank — including AUTH_SECRET, which the production build REQUIRES
# (routes do module-level checks). Feed the interpolation from .env.local:
#   docker compose --env-file .env.local -f docker-compose.coolify.yml up -d
#
# Host sizing: the first boot builds Next.js inside the app container (needs
# ~3-4GB peak RAM; ~10-20 min on a 2-vCPU VPS, less on more cores).
# Recommended: 8GB RAM / 4 vCPU / 40GB disk + 4GB swap. After that first build
# the app serves at ~0.5-0.8GB and the whole stack idles around 1.5-2GB.
# Subsequent boots skip the build when the source CONTENT and the build-time
# public env are unchanged (content-hash + env stamps on the persistent .next
# volume) — container restarts AND image redeploys of unchanged code come up
# in ~1 min. A real code change rebuilds — that is the deploy window on a
# 2-vCPU box, so redeploy code changes off-hours.
#
# Backups: the `backup` service runs pg_dump daily into the
# `simplerdev-backups` volume (retention via BACKUP_RETENTION_DAYS, default
# 14 days; runs one dump immediately on boot). Restore from that container's
# terminal (Coolify UI -> container shell):
#   ls /backups
#   gunzip -c /backups/simplerdev-<ts>.sql.gz | psql -h db -U postgres -d simplerdev
# Off-site copies (S3) are a planned follow-up — the volume lives on this VPS.
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    # Postgres 16 + pgvector. The `database` target copies docker/initdb SQL
    # so the extensions (vector, pg_trgm, pgcrypto) exist before the first
    # migration runs.
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: simplerdev
    volumes:
      - simplerdev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simplerdev"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port: only the app and its siblings reach the DB, internally.
    deploy:
      resources:
        limits:
          memory: 768M

  mailpit:
    # SMTP catcher (EMAIL_TRANSPORT=mailpit default). No host port — reach its
    # UI through Coolify's container terminal, or temporarily publish 8025 if
    # you need it. For real email: set EMAIL_TRANSPORT=resend + RESEND_API_KEY.
    image: axllent/mailpit:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: source
    restart: unless-stopped
    working_dir: /workspace
    # Production boot: install deps, migrate, then build ONCE (cached on the
    # .next volume) and serve. The rebuild check compares the source CONTENT
    # hash and the build-time public env — NOT mtimes — so an image redeploy
    # of unchanged code (which rewrites every file) still reuses the cached
    # build. NEXT_PUBLIC_* values are inlined into the client bundle at build
    # time, so a URL change (e.g. adding your domain later) must force a
    # rebuild; the env stamp comparison handles that automatically.
    command: >
      sh -lc "echo '[boot] 1/6 bun install' &&
      bun install --frozen-lockfile --linker=hoisted &&
      echo '[boot] 2/6 verify db target' &&
      bun scripts/verify-db-target.ts &&
      echo '[boot] 3/6 drizzle migrate' &&
      bunx drizzle-kit migrate &&
      echo '[boot] 4/6 manual migrations' &&
      bun scripts/apply-local-manual-migrations.ts &&
      { [ -f .next/BUILD_ID ] && [ \"$(find . -name node_modules -prune -o -name .next -prune -o -name next-env.d.ts -prune -o -type f -exec sha256sum {} + | sort | sha256sum | cut -d' ' -f1)\" = \"$(cat .next/.src-hash 2>/dev/null)\" ] && [ \"$(env | grep -E '^(NEXT_PUBLIC_|AUTH_GOOGLE_|GOOGLE_CLIENT_)' | sort)\" = \"$(cat .next/.env-stamp 2>/dev/null)\" ] && echo 'reusing existing .next build' || { echo '[boot] 5/6 building Next (first boot, source or public env changed)'; find . -name node_modules -prune -o -name .next -prune -o -name next-env.d.ts -prune -o -type f -exec sha256sum {} + | sort | sha256sum | cut -d' ' -f1 > /tmp/.src-hash-before;       find .next -mindepth 1 -delete 2>/dev/null || true; NODE_OPTIONS=\"--max-old-space-size=2048\" node node_modules/next/dist/bin/next build && cp /tmp/.src-hash-before .next/.src-hash && env | grep -E '^(NEXT_PUBLIC_|AUTH_GOOGLE_|GOOGLE_CLIENT_)' | sort > .next/.env-stamp; }; } &&
      echo '[boot] 6/6 starting next server' &&
      node node_modules/next/dist/bin/next start"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - path: .env.local
        required: false
    environment:
      # ── Build tuning ──────────────────────────────────────────────────────
      # 1 prerender worker + low-memory mode + a capped V8 heap: this app's
      # build peaks hard (~7GB observed) and OOM-killed a 2-vCPU/8GB VPS with
      # 2 workers. On a big host (16GB+) try NEXT_BUILD_CPUS=4.
      NEXT_BUILD_CPUS: ${NEXT_BUILD_CPUS:-1}
      NEXT_LOW_MEMORY_BUILD: ${NEXT_LOW_MEMORY_BUILD:-1}
      # ── Database (same password interpolation as the db service) ──────────
      # DRIZZLE_DATABASE_URL is the channel verify-db-target.ts + drizzle.config
      # prefer inside containers (an .env.local placeholder cannot clobber it).
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/simplerdev
      DRIZZLE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/simplerdev
      # Per-process Postgres pool. lib/db defaults to 1 (build-safe); the
      # serving process wants more so concurrent requests + the per-minute cron
      # drains don't serialize on a single connection.
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # ── Public URLs — SET THESE to your deploy origin in Coolify ──────────
      # The host middleware rejects unknown hosts on non-localhost origins.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # ── Realtime (live collaboration) ─────────────────────────────────────
      # Internal URL always resolves through the compose network. The browser
      # URL must be publicly reachable (wss://domain) only if you enable live
      # collab; without it, collab features degrade to disabled (503).
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-ws://localhost:3030}
      REALTIME_INTERNAL_URL: http://realtime:3030
      REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:-sd-local-dev-realtime-jwt-secret}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-sd-local-dev-realtime-internal-secret}
      AUTH_TRUST_HOST: "true"
      PORT: "3000"
      # ── Secrets forwarded from the Coolify env UI ─────────────────────────
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      WORKSPACE_TENANT_SECRETS_KEY: ${WORKSPACE_TENANT_SECRETS_KEY:-}
      PORTAL_KMS_KEY: ${PORTAL_KMS_KEY:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      CHAT_TOKEN_SECRET: ${CHAT_TOKEN_SECRET:-}
      # ── AI / email / media (optional features) ────────────────────────────
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-mailpit}
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: "1025"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:-}
      # ── Google login (BUILD-TIME: the login button is computed in
      # next.config.ts during the build — included in the env stamp above) ──
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # ── S3-compatible object storage (media uploads) ──────────────────────
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Any other optional integration (Meta, GitHub, LinkedIn, Zoom, …) can be
      # forwarded the same way — see the annotated list in .env.example.
    volumes:
      - simplerdev-app-node-modules:/workspace/node_modules
      # .next on a named volume: the build cache survives redeploys, so only a
      # real change (sources or public env) triggers a rebuild.
      - simplerdev-app-next:/workspace/.next
    ports:
      # Only the web app is published. If the host's 3000 is taken, set
      # APP_PORT in Coolify. (Coolify's proxy can also route by FQDN.)
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun --eval \"fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      # First boot runs `bun install` + the first Next production build INSIDE
      # the container. On a 2-vCPU VPS (e.g. Hostinger KVM 2) that can take
      # 15-40 min — keep this well above it, otherwise the cron service's
      # depends_on: service_healthy aborts the deploy while the app is still
      # building. 2400s + the 30x10s retries = ~45 min before unhealthy.
      start_period: 2400s
    # No hard memory limit by default: the first-boot `bun run build` needs
    # headroom (~3-4GB peak). Once the build is cached on the .next volume you
    # can add a limit here, e.g. memory: 2G.

  cron:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: source
    restart: unless-stopped
    working_dir: /workspace
    command: sh -lc "bun install --frozen-lockfile && bun scripts/cron-runner.ts"
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      CRON_BASE_URL: http://app:3000
      # Explicit (wins over env_file): a host-side .env.local DATABASE_URL
      # (localhost:port) is meaningless inside the container network.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/simplerdev
      # Required: the runner refuses to start without it (and the app rejects
      # calls whose bearer token doesn't match). Set it in Coolify.
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - simplerdev-cron-node-modules:/workspace/node_modules
    healthcheck:
      test: ["CMD-SHELL", "grep -qa cron-runner /proc/[0-9]*/cmdline 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1200s # cold bun install grace — see app service note
    deploy:
      resources:
        limits:
          memory: 384M

  realtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.coolify
      target: source
    restart: unless-stopped
    working_dir: /workspace/packages/realtime-server
    command: sh -lc "bun install --frozen-lockfile && bun src/server.ts"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/simplerdev
      REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:-sd-local-dev-realtime-jwt-secret}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:-sd-local-dev-realtime-internal-secret}
      PORT: "3030"
    volumes:
      # realtime-server is a workspace member, so its `bun install` resolves the
      # workspace ROOT and writes /workspace/node_modules — without this volume
      # that lands on the image layer (slow, lost on redeploy).
      - simplerdev-realtime-root-node-modules:/workspace/node_modules
      - simplerdev-realtime-node-modules:/workspace/packages/realtime-server/node_modules
    # No host port published. To use live collaboration, give this service a
    # Coolify domain on port 3030 (e.g. wss://realtime.example.com) and set
    # NEXT_PUBLIC_REALTIME_URL to it. Without that, collab degrades to
    # disabled — nothing else breaks.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun --eval \"fetch('http://localhost:3030/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1200s # cold bun install grace — see app service note
    deploy:
      resources:
        limits:
          memory: 384M

  backup:
    # Daily logical backup of the `db` database: pg_dump | gzip into the
    # `simplerdev-backups` volume, keeping BACKUP_RETENTION_DAYS of history.
    # First dump runs immediately on boot, then every BACKUP_INTERVAL_SECONDS
    # (default 24 h). Restore instructions live in this file's header comment.
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: simplerdev
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - simplerdev-backups:/backups
    command: >
      sh -lc "mkdir -p /backups &&
      while true; do
        ts=$$(date -u +%Y%m%d-%H%M%S);
        out=/backups/simplerdev-$${ts}.sql.gz;
        if pg_dump --no-owner --no-privileges > /tmp/backup.sql && [ -s /tmp/backup.sql ] && gzip -9 < /tmp/backup.sql > $${out}.part; then
          mv $${out}.part $${out};
          echo backup-ok:$${out};
        else
          echo backup-failed:$${ts};
          rm -f $${out}.part;
        fi;
        rm -f /tmp/backup.sql;
        find /backups -maxdepth 1 -name 'simplerdev-*.sql.gz' -mtime +$${BACKUP_RETENTION_DAYS} -delete;
        sleep $${BACKUP_INTERVAL_SECONDS};
      done"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  simplerdev-pgdata:
  simplerdev-app-node-modules:
  simplerdev-cron-node-modules:
  simplerdev-app-next:
  simplerdev-realtime-root-node-modules:
  simplerdev-realtime-node-modules:
  simplerdev-backups:
